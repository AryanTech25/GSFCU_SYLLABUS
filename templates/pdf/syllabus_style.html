<style>
        /* 
        xhtml2pdf uses custom @page and @frame rules.
        These are NOT standard CSS and WILL show IDE warnings.
        These warnings are FALSE POSITIVES and must be ignored.
        */
        @page {
            size: A4;
            margin: 1.5cm;
            margin-top: 4.5cm;
            margin-bottom: 2cm;

            @frame header_frame {
                -pdf-frame-content: header_content;
                left: 1.5cm;
                right: 1.5cm;
                top: 1cm;
                height: 3.5cm;
            }

            @frame footer_frame {
                -pdf-frame-content: footer_content;
                left: 1.5cm;
                right: 1.5cm;
                bottom: 1cm;
                height: 1cm;
            }
        }

        @page landscape {
            size: A4 landscape;
            margin: 1.5cm;
            margin-top: 4.5cm;
            margin-bottom: 2cm;

            @frame header_frame {
                -pdf-frame-content: header_content;
                left: 1.5cm;
                right: 1.5cm;
                top: 1cm;
                height: 3.5cm;
            }

            @frame footer_frame {
                -pdf-frame-content: footer_content;
                left: 1.5cm;
                right: 1.5cm;
                bottom: 1cm;
                height: 1cm;
            }
        }

        .landscape-section {
            page: landscape;
        }

        /* Screen preview matching PDF */
        @media screen {
            body {
                width: 210mm;
                min-height: 297mm;
                margin: 20px auto;
                padding: 1.5cm;
                padding-top: 4.5cm;
                border: 1px solid #ccc;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                background-color: white;
                position: relative;
            }

            html {
                background-color: #f0f0f0;
                display: flex;
                justify-content: center;
            }

            /* Simulate header frame in browser */
            #header_content {
                position: absolute;
                top: 1cm;
                left: 1.5cm;
                right: 1.5cm;
                height: 3.5cm;
            }

            #footer_content {
                display: none;
            }
        }

        body {
            font-family: "Times New Roman", Times, serif;
            font-size: 12pt;
            color: #000;
            line-height: 1.3;
        }

        /* HEADER */
        #header_content {
            width: 100%;
            border-bottom: 2px solid #000;
            padding-bottom: 5px;
        }

        .header-table {
            width: 100%;
            border: none;
        }

        .header-table td {
            border: none;
            vertical-align: top;
            padding: 0;
        }

        .school-name {
            font-family: "Times New Roman", Times, serif;
            font-size: 10pt;
            font-weight: normal;
            margin: 0;
            line-height: 1.4;
        }

        .program-name {
            font-family: "Times New Roman", Times, serif;
            font-size: 10pt;
            font-weight: normal;
            margin: 0;
            line-height: 1.4;
        }

        .academic-year {
            font-family: "Times New Roman", Times, serif;
            font-size: 10pt;
            font-weight: normal;
            margin: 0;
            line-height: 1.4;
        }

        .logo-img {
            width: 140px;
            height: auto;
        }

        /* TABLES - DENSE & ACADEMIC */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
            page-break-inside: avoid;
        }

        .long-table {
            page-break-inside: auto;
            table-layout: fixed;
            width: 100%;
        }

        .long-table tr {
            page-break-inside: avoid;
            page-break-after: auto;
        }

        th,
        td {
            border: 1px solid #000;
            padding: 4px 6px;
            vertical-align: top;
            text-align: left;
            font-size: 12pt;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        th {
            font-weight: bold;
            background-color: #CCCCCC;
            color: #000;
        }

        thead {
            display: table-header-group;
            page-break-after: avoid;
            break-after: avoid;
            -pdf-keep-with-next: true;
        }

        thead tr {
            page-break-inside: avoid;
            page-break-after: avoid;
            break-after: avoid;
            -pdf-keep-with-next: true;
        }

        .center {
            text-align: center;
        }

        .bold {
            font-weight: bold;
        }

        /* SECTION TITLES */
        h4 {
            font-size: 14pt;
            font-weight: bold;
            text-transform: uppercase;
            margin: 15px 0 8px 0;
            page-break-after: avoid;
            break-after: avoid;
            -pdf-keep-with-next: true;
        }

        /* Lists */
        ul,
        ol {
            margin: 0;
            padding-left: 18px;
        }

        li {
            margin-bottom: 2px;
        }

        /* Utilities */
        .no-border-table td {
            border: none;
            padding: 1px;
        }

        .objectives-heading {
            font-size: 14pt;
        }

        /* Small font for narrow header cells in Teaching Scheme table */
        .th-sm {
            font-size: 9pt;
            font-weight: bold;
            padding: 4px 2px;
            white-space: normal;
            word-break: break-word;
            text-align: center;
            vertical-align: middle;
            background-color: #CCCCCC;
            border: 1px solid #000;
        }

        /* Teaching Scheme table specific */
        .teaching-scheme-table {
            table-layout: fixed;
            width: 100%;
        }

        .teaching-scheme-table th {
            font-size: 9pt;
            padding: 4px 2px;
            text-align: center;
            vertical-align: middle;
            white-space: normal;
            word-break: break-word;
        }

        .teaching-scheme-table td {
            font-size: 11pt;
            padding: 4px 2px;
            text-align: center;
            vertical-align: middle;
        }
</style>
