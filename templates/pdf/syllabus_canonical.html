{% load custom_filters %}
<!DOCTYPE html>

<html>

<head>
    <meta charset="utf-8">
    {% include 'pdf/syllabus_style.html' %}
</head>

<body>

    <!-- REPEATING HEADER (Handled by @frame in PDF) -->
    <div id="header_content">
        <table class="header-table">
            <tr>
                <td style="width: 75%;">
                    <div class="school-name">{{ school_name }}</div>
                    <div class="program-name">{{ program_name }}</div>
                    <div class="academic-year">Academic Year: {{ academic_year }}</div>
                </td>
                <td style="width: 25%; text-align: right;">
                    <img src="{{ logo_path }}" class="logo-img">
                </td>
            </tr>
        </table>
    </div>

    <!-- REPEATING FOOTER (Handled by @frame in PDF) -->
    <div id="footer_content" style="text-align: right; font-family: 'Times New Roman', Times, serif; font-size: 11pt;">
        <span style="font-weight: bold;"><pdf:pagenumber /></span> <span style="font-weight: normal;">| Page</span>
    </div>

    {% include 'pdf/syllabus_body.html' %}

</body>

</html>
