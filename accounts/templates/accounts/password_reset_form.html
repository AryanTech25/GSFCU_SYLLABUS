{% extends 'base.html' %}

{% block title %}Reset Password | GSFC Curriculum Builder{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="login-header-logo">
        <img src="/static/images/gsfc_logo.png" alt="GSFC University" class="gsfc-logo-lg">
    </div>
    <div class="card login-card">
        <h2 style="margin-bottom:.5rem;text-align:center;">Reset Password</h2>
        <p style="text-align:center;color:#6b7280;font-size:.9rem;margin-bottom:1.5rem;">
            Enter your registered email address. If an account exists, a reset link will be sent.
        </p>

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control"
                       placeholder="your@email.com" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Send Reset Link</button>
        </form>

        <p style="text-align:center;margin-top:1.25rem;font-size:.9rem;">
            <a href="{% url 'login' %}" style="color:var(--gsfc-blue);">← Back to Login</a>
        </p>
    </div>
</div>
{% endblock %}
