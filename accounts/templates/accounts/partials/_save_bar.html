<div class="sb-save-bar" id="sb-save-bar">
    <div class="sb-save-bar__progress">
        <span class="sb-save-bar__progress-label">Completeness</span>
        <div class="sb-save-bar__progress-track">
            <div class="sb-save-bar__progress-fill" id="sb-pct-bar"></div>
        </div>
        <span class="sb-save-bar__pct" id="sb-pct-label">—</span>
    </div>

    <button type="button" id="sb-ajax-save-btn" class="sb-save-bar__btn" data-action="ajax-save">
        <span>&#128190;</span> Save Draft
    </button>

    <div id="sb-spinner" class="sb-save-bar__spinner">
        <div class="sb-spinner-ring"></div>
        Saving…
    </div>
</div>

<div id="sb-toast"></div>
