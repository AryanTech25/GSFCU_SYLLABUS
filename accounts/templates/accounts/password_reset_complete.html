{% extends 'base.html' %}

{% block title %}Password Reset Complete | GSFC Curriculum Builder{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="login-header-logo">
        <img src="/static/images/gsfc_logo.png" alt="GSFC University" class="gsfc-logo-lg">
    </div>
    <div class="card login-card" style="text-align:center;">
        <div style="font-size:2.5rem;margin-bottom:.75rem;">✅</div>
        <h2 style="margin-bottom:.5rem;">Password Updated</h2>
        <p style="color:#6b7280;font-size:.9rem;">
            Your password has been set successfully.<br>
            You can now log in with your new password.
        </p>
        <a href="{% url 'login' %}" class="btn btn-primary"
           style="display:inline-block;margin-top:1.25rem;text-decoration:none;">
            Go to Login
        </a>
    </div>
</div>
{% endblock %}
